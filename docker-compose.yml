version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: synthleak-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - DATABASE_PATH=/app/data/synthleak.db
    volumes:
      - synthleak-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Note: Frontend service configuration is reserved for when the React dashboard is implemented.
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: synthleak-frontend
  #   ports:
  #     - "3000:80"
  #   environment:
  #     - VITE_API_BASE_URL=http://localhost:8000
  #     - VITE_WS_STREAM_URL=ws://localhost:8000/ws/stream
  #   depends_on:
  #     backend:
  #       condition: service_healthy
  #   restart: unless-stopped

volumes:
  synthleak-data:
    name: synthleak-data
